spring:
  datasource:
    url: jdbc:h2:mem:logingest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:h2-schema.sql

mybatis:
  mapper-locations: classpath*:mapper/ingestion/*.xml
  configuration:
    map-underscore-to-camel-case: true
