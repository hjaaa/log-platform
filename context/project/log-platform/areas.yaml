# 项目业务域白名单
#
# 路径：context/project/log-platform/areas.yaml
# 消费者：check-meta.sh 校验 meta.yaml.feature_area 时的合法值来源
#
# 变更原则：
#   - 新增业务域：PR review 即可合入
#   - 删除或重命名业务域：必须同步排查历史 meta.yaml.feature_area 引用
#   - 命名小写、连字符连接（kebab-case），不使用中文与驼峰

areas:
  - log-collection   # 日志采集、接入、写入
  - log-search       # 日志查询、过滤、分页
  - log-source       # 日志来源管理（注册、鉴权、状态）
  - alert-rule       # 告警规则配置、触发逻辑
  - notification     # 通知渠道配置（钉钉等）
  - infra            # 基础设施、部署、监控、健康检查
